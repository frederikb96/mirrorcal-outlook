name: Setup
description: Install Bun and the locked dependencies on a bare runner

runs:
  using: composite
  steps:
    # setup-bun fetches a zip archive; the package script writes one
    - name: Install host prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates unzip zip
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # renovate: datasource=github-releases depName=oven-sh/bun
        bun-version: 1.4.4
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
